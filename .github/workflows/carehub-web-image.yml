# CareHub: builds the web app image from this repository's source code
# and stores it privately in GitHub Packages (ghcr.io).
name: CareHub - build web image

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: carehub-web-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push carehub-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=carehub-${{ github.sha }}
          tags: |
            ghcr.io/felipe01-nav/carehub-web:latest
            ghcr.io/felipe01-nav/carehub-web:${{ github.sha }}
          cache-from: type=gha,scope=carehub-web
          cache-to: type=gha,mode=max,scope=carehub-web,ignore-error=true

      - name: Keep only the 2 newest web images (saves storage)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: carehub-web
          package-type: container
          min-versions-to-keep: 2
