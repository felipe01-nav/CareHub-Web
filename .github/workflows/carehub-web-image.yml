# CareHub: builds the web app from this repository's source code and stores
# the image privately in GitHub Packages (ghcr.io).
#
# The app is built directly on the GitHub runner (same steps AppFlowy's own
# tested CI uses: Node 24 + pnpm), then packed into a small nginx image.
name: CareHub - build web image

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: carehub-web-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: |
          cp deploy.env .env
          pnpm run build
          test -f dist/index.html
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
          APPFLOWY_WEB_VERSION: carehub-${{ github.sha }}

      - name: Prepare image folder
        run: |
          mkdir -p carehub-image
          cp -r dist carehub-image/dist
          cp docker/nginx.conf carehub-image/nginx.conf
          cp docker/entrypoint.sh carehub-image/entrypoint.sh
          cp docker/carehub-web.Dockerfile carehub-image/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push carehub-web
        uses: docker/build-push-action@v6
        with:
          context: carehub-image
          file: carehub-image/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/felipe01-nav/carehub-web:latest
            ghcr.io/felipe01-nav/carehub-web:${{ github.sha }}

      - name: Keep only the 2 newest web images (saves storage)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: carehub-web
          package-type: container
          min-versions-to-keep: 2
