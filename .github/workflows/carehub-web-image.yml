# CareHub: builds the web app and stores the image privately in GitHub
# Packages (ghcr.io).
#
# The web source is PINNED to a known-good AppFlowy-Web commit. Newer commits
# (from 2026-10-14 "atomic creation", #626) need commercial-only server APIs
# that the open-source CareHub-Cloud server does not have, so page creation
# fails with "Update the server to use this creation feature".
# The CareHub packaging files (docker/*) still come from this branch.
name: CareHub - build web image

on:
  push:
    branches: [main]
    paths-ignore:
      - "doc/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: carehub-web-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Parent of the "atomic creation" commit 1e08fd92 (works with legacy server)
  WEB_SOURCE_REF: 128e2d1df0407b2d65318a4e34855fcebc30fefd

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out CareHub packaging files
        uses: actions/checkout@v4
        with:
          path: carehub

      - name: Check out pinned web source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WEB_SOURCE_REF }}
          path: app

      - name: Apply CareHub branding (login page, tab title, icon)
        working-directory: app
        run: python3 ../carehub/carehub/rebrand.py

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        working-directory: app
        run: |
          cp deploy.env .env
          pnpm run build
          test -f dist/index.html
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=6144
          APPFLOWY_WEB_VERSION: carehub-${{ env.WEB_SOURCE_REF }}

      - name: Prepare image folder
        run: |
          mkdir -p carehub-image
          cp -r app/dist carehub-image/dist
          cp carehub/docker/nginx.conf carehub-image/nginx.conf
          cp carehub/docker/entrypoint.sh carehub-image/entrypoint.sh
          cp carehub/docker/carehub-web.Dockerfile carehub-image/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push carehub-web
        uses: docker/build-push-action@v6
        with:
          context: carehub-image
          file: carehub-image/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/felipe01-nav/carehub-web:latest
            ghcr.io/felipe01-nav/carehub-web:${{ github.sha }}

      - name: Keep only the 2 newest web images (saves storage)
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: carehub-web
          package-type: container
          min-versions-to-keep: 2
